# Authoritative configuration for TARS Cloud Website (https://tars-cloud.ai)
base_url = "https://tars-cloud.ai"
title = "TARS Cloud"
description = "Official portal, documentation hub, and download distribution center for TARS Cloud."
default_language = "en"

build_search_index = false
compile_sass = false
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", feed = true },
  { name = "categories", feed = true }
]

[extra]
repository_url = "https://github.com/tars-cloud/website"
docs_url = "https://tars-cloud.ai/docs"
downloads_url = "https://tars-cloud.ai/downloads"
contact_email = "cooper@tars-cloud.ai"

theme_mode = "tactical-cyberpunk"
accent_cyan = "#00f3ff"
accent_amber = "#ffb700"
bg_dark = "#0a0d12"
bg_panel = "#121820"
enable_scanlines = true
scanline_opacity = 0.08
terminal_font = "JetBrains Mono, monospace"
body_font = "Inter, sans-serif"

obsidian = "#0a0a0c"
surface_raised = "#121318"
border_color = "#27272a"
accent_cyan_hex = "#00f0ff"
github_org_url = "https://github.com/tars-cloud"
og_image = "/images/og-banner.png"
logo_path = "/images/tars-logo.svg"
status_label = "SYS // NOMINAL"
hero_badge = "SYS // SOVEREIGN_MULTI_AGENT_RUNTIME // GUARDS_V3.5"
hero_headline = "Your AI Factory gives you tokens. TARS gives you governed outcomes"
hero_subtitle = "SOVEREIGN MULTI-AGENT ENGINEERING // GOVERNED BY GUARDS"
quickstart_cmd = "tars-run-issue --yolo 42"

[[extra.menu_items]]
